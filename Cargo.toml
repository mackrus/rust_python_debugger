[package]
name = "rust_python_debugger"
version = "0.1.0"
edition = "2021"
description = "In-browser Python visual debugger powered by RustPython and WebAssembly"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rustpython-vm = { version = "0.5.0", default-features = false, features = ["compiler", "wasmbind"] }
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
